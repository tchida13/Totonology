name: バグ報告
description: 期待と異なる動作の報告
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. 
        2. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 環境
      description: ブラウザ・OS など
      placeholder: Safari 18 / iOS 19
