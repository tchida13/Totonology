name: 機能・改善
description: 新機能の追加や既存機能の改善
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景・目的
      description: なぜ必要か、誰の何の課題を解決するか
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: 内容
      description: 実現したいこと。画面イメージや仕様があれば記載
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 何ができたら完了か（チェックリスト形式を推奨）
      placeholder: |
        - [ ] 
    validations:
      required: true
