name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript 構文チェック
        run: for f in js/*.js; do node --check "$f"; done

      - name: テスト
        run: node --test

      - name: index.html の参照ファイル確認
        run: |
          status=0
          for f in $(grep -oE '(src|href)="[^"#:]+"' index.html | sed -E 's/^(src|href)="(.*)"$/\2/'); do
            if [ ! -f "$f" ]; then echo "missing: $f"; status=1; fi
          done
          exit $status
