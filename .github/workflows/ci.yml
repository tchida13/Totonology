name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript 構文チェック
        run: for f in js/*.js; do node --check "$f"; done

      - name: テスト
        run: node --test

      - name: タイプ別ページの鮮度確認（js/data.js と生成物が一致するか）
        run: node scripts/build-types.js --check

      - name: OGP 画像の鮮度確認（js/data.js・share.js・写真と画像が一致するか）
        run: node scripts/build-ogp.js --check

      - name: index.html の参照ファイル確認
        run: |
          status=0
          for f in $(grep -oE '(src|href)="[^"#:]+"' index.html | sed -E 's/^(src|href)="(.*)"$/\2/; s/\?.*$//'); do
            if [ ! -f "$f" ]; then echo "missing: $f"; status=1; fi
          done
          exit $status

      - name: 公開ファイルの確認（HTML/CSS/JS が参照するファイルが公開対象に含まれるか）
        run: |
          scripts/collect-site.sh _site
          status=0
          refs=$(grep -ohE '(src|href)="[^"#:]+"' index.html | sed -E 's/^(src|href)="(.*)"$/\2/; s/\?.*$//')
          refs="$refs $(grep -ohE 'assets/[A-Za-z0-9_./-]+\.(svg|jpe?g|png|webp|gif|ico)' index.html style.css js/*.js | sort -u)"
          for f in $refs; do
            if [ ! -f "_site/$f" ]; then echo "not published: $f"; status=1; fi
          done
          for f in robots.txt sitemap.xml; do
            if [ ! -f "_site/$f" ]; then echo "not published: $f"; status=1; fi
          done
          codes=$(node -e 'globalThis.window=globalThis;require("./js/data.js");console.log(Object.keys(window.TYPES).join(" "))')
          if [ -z "$codes" ]; then echo "no type codes found"; exit 1; fi
          for code in $codes; do
            lc=$(echo "$code" | tr 'A-Z' 'a-z')
            if [ ! -f "_site/assets/characters/$code.svg" ]; then echo "not published: assets/characters/$code.svg"; status=1; fi
            if [ ! -f "_site/types/$lc.html" ]; then echo "not published: types/$lc.html"; status=1; fi
            if [ ! -f "_site/assets/ogp/$lc.jpg" ]; then echo "not published: assets/ogp/$lc.jpg"; status=1; fi
          done
          if [ ! -f "_site/assets/ogp/top.jpg" ]; then echo "not published: assets/ogp/top.jpg"; status=1; fi
          exit $status
