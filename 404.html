<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 | Totonology</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#161210">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161210'/%3E%3Cg transform='translate(9 8) scale(1.95)' fill='%23C9A96E' fill-opacity='.16' stroke='%23C9A96E' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z'/%3E%3C/g%3E%3C/svg%3E">
<!-- GitHub Pages は存在しない URL(例: /Totonology/foo/bar)でもこのファイルを返す。相対パスだと崩れるため、CSS・アイコンはすべて内包して自己完結させる -->
<style>
:root{--bg:#161210;--fg:#EFE6DA;--sub:#A89C90;--gold:#C9A96E}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;color:var(--fg);background:radial-gradient(120% 60% at 50% 115%,rgba(228,105,60,.28),transparent 62%),var(--bg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.75}
.brand{margin-bottom:36px;color:var(--sub);font-size:.85rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
.no{margin:0;font-family:"Iowan Old Style",Palatino,Georgia,"Noto Serif",serif;font-size:clamp(5rem,28vw,9rem);font-weight:400;line-height:1;letter-spacing:.04em;color:var(--gold)}
.rule{width:56px;height:1px;margin:22px auto;border:0;background:var(--gold);opacity:.6}
h1{margin:0;font-size:1.15rem;font-weight:600;letter-spacing:.08em}
p{margin:10px 0 0;color:var(--sub);font-size:.9rem}
.btn{display:inline-block;margin-top:32px;padding:14px 32px;border:1.5px solid var(--gold);border-radius:4px;color:var(--gold);font-weight:600;letter-spacing:.08em;text-decoration:none;transition:background .15s,color .15s}
.btn:hover{background:var(--gold);color:var(--bg)}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="brand">Totonology</div>
<div class="no" aria-hidden="true">404</div>
<hr class="rule">
<h1>ページが見つかりません</h1>
<p>サウナ室を出て、少し迷ってしまったようです。<br>URL をご確認のうえ、トップからもう一度どうぞ。</p>
<a class="btn" id="home" href="https://tchida13.github.io/Totonology/">トップへ戻る</a>
<script>
// プロジェクトページ(github.io/<repo>/)でも独自ドメイン(/)でも、配信場所のトップへ戻す
(function () {
  var l = location, seg = l.pathname.split("/")[1], base = "/";
  if (/\.github\.io$/.test(l.hostname) && seg) base = "/" + seg + "/";
  document.getElementById("home").href = base;
})();
</script>
</body>
</html>
